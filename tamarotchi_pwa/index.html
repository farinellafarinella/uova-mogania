      display: flex;

      padding: 10px;

      border-radius: 5px;
      text-align: left;
    }
    button {
  margin: 5px;
  padding: 10px 20px;
  font-size: 16px;
  transition: background-color 0.3s, transform 0.3s;
}
    .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
  }

  .hp-bar {
    height: 20px;
    transition: width 0.5s ease-in-out;
  }
</style>
